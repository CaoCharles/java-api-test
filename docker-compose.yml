version: '3.8'

services:
  # PostgreSQL 資料庫
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d userdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Java Spring Boot API
  spring-boot-api:
    build:
      context: ./spring-boot-api
      dockerfile: Dockerfile
    container_name: spring-boot-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # Python FastAPI
  fastapi-gateway:
    build:
      context: ./fastapi-gateway
      dockerfile: Dockerfile
    container_name: fastapi-gateway
    ports:
      - "8000:8000"
    environment:
      SPRING_BOOT_API_URL: http://spring-boot-api:8080
    depends_on:
      - spring-boot-api
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
